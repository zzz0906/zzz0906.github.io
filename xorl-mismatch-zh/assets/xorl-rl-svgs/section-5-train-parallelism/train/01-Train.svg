<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1280" height="720" fill="#f8f9fa" opacity="0.5"/>
  <text x="50" y="80" font-size="64" font-weight="800" fill="#1a73e8">Train</text>

  <!-- π_train block -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="200" height="240" rx="16" fill="#fff" stroke="#1a73e8" stroke-width="3.5"/>
    <text x="100" y="132" text-anchor="middle" font-size="62" fill="#1a73e8" font-weight="800">π<tspan dy="14" font-size="40">train</tspan></text>
  </g>
  <text x="140" y="418" text-anchor="middle" font-size="36" fill="#1a73e8" font-weight="600">Training</text>
  <text x="140" y="458" text-anchor="middle" font-size="36" fill="#1a73e8" font-weight="600">Engine</text>

  <!-- Dashed update arrow from panel back toward left box -->
  <path d="M 248 205 Q 285 178 283 222 Q 281 268 262 273 Q 250 278 247 262" fill="none" stroke="#1a73e8" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="242,262 252,280 258,258" fill="#1a73e8"/>

  <!-- Large white panel -->
  <g transform="translate(300, 140)">
    <rect x="0" y="0" width="940" height="370" rx="16" fill="#fff" stroke="#dadce0" stroke-width="2"/>

    <!-- Line 1: "update θ to increase" — centered, 44px -->
    <text x="470" y="125" text-anchor="middle" font-size="52" font-weight="600" fill="#222">update <tspan font-weight="800" fill="#222">θ</tspan> to increase</text>

    <!-- Line 2: "log π_train(y_i | x_i; θ) when Z_i is high" — centered, 50px -->
    <text x="470" y="210" text-anchor="middle" font-size="50" font-weight="700">
      <tspan fill="#222">log </tspan>
      <tspan fill="#1a73e8">π</tspan><tspan fill="#1a73e8" font-size="32" baseline-shift="sub">train</tspan>
      <tspan fill="#222">(</tspan>
      <tspan fill="#b8860b">y</tspan><tspan fill="#b8860b" font-size="32" baseline-shift="sub">i</tspan>
      <tspan fill="#222"> | </tspan>
      <tspan fill="#7b61ff">x</tspan>
      <tspan fill="#222">; </tspan>
      <tspan fill="#222" font-weight="800">θ</tspan>
      <tspan fill="#222">)</tspan>
      <tspan fill="#222"> when </tspan>
      <tspan fill="#0d904f">Z</tspan><tspan fill="#0d904f" font-size="32" baseline-shift="sub">i</tspan>
      <tspan fill="#222"> is high</tspan>
    </text>

    <!-- Lightweight legend row — bottom of panel -->
    <g transform="translate(130, 295)">
      <rect x="0" y="0" width="24" height="24" rx="4" fill="#b8860b"/>
      <text x="34" y="20" font-size="30" fill="#b8860b" font-weight="600">y<tspan font-size="20" baseline-shift="sub">i</tspan> = answer</text>

      <rect x="260" y="0" width="24" height="24" rx="4" fill="#7b61ff"/>
      <text x="294" y="20" font-size="30" fill="#7b61ff" font-weight="600">x = prompt</text>

      <rect x="490" y="0" width="24" height="24" rx="4" fill="#0d904f"/>
      <text x="524" y="20" font-size="30" fill="#0d904f" font-weight="600">Z<tspan font-size="20" baseline-shift="sub">i</tspan> = advantage</text>
    </g>
  </g>

  <!-- Progress bar -->
</svg>
