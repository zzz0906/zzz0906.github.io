<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">

<defs>
  <linearGradient id="regime-bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#28c840" stop-opacity="0.10"/>
    <stop offset="50%" stop-color="#FAFAFA" stop-opacity="0.0"/>
    <stop offset="100%" stop-color="#D97706" stop-opacity="0.10"/>
  </linearGradient>
</defs>

<rect width="1280" height="720" fill="#FAFAFA"/>

<!-- Gradient tint across plot area -->
<rect x="160" y="60" width="1020" height="530" fill="url(#regime-bg)"/>

<!-- ── Axes ── -->
<line x1="160" y1="590" x2="1180" y2="590" stroke="#1a1a1a" stroke-width="1.5" opacity="0.25"/>
<line x1="160" y1="590" x2="160" y2="60" stroke="#1a1a1a" stroke-width="1.5" opacity="0.25"/>

<!-- Axis arrowheads -->
<polygon points="1180,590 1170,585 1170,595" fill="#1a1a1a" opacity="0.25"/>
<polygon points="160,60 155,70 165,70" fill="#1a1a1a" opacity="0.25"/>

<!-- Axis labels -->
<text x="670" y="636" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="40" font-weight="700" fill="#444444" text-anchor="middle">Speed →</text>
<text x="68" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="40" font-weight="700" fill="#444444" text-anchor="middle"
      transform="rotate(-90, 68, 330)">Throughput</text>

<!-- PARETO CURVE -->
<path d="M250,100 C340,105 450,130 560,200 C670,270 800,380 920,460 C990,510 1060,545 1100,560"
      fill="none" stroke="#2D3748" stroke-width="4.5" stroke-linecap="round"/>

<!-- Endpoint markers -->
<circle cx="250" cy="100" r="10" fill="#27AE60" opacity="0.25"/>
<circle cx="1100" cy="560" r="10" fill="#D97706"/>

<!-- RIGHT: just "Low concurrency" -->
<text x="920" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="56" font-weight="700" fill="#D97706" text-anchor="middle">Low concurrency</text>

</svg>
