<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- ============ HEADER BAR ============ -->
  <rect x="0" y="0" width="750" height="42" fill="#2563EB"/>
  <rect x="738" y="0" width="24" height="42" rx="12" fill="#2563EB"/>
  <text x="24" y="29" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">Speculating Experts Accelerates Inference for Mixture-of-Experts</text>

  <!-- ============ PYRAMID (center=560) ============ -->
  <polygon points="560,44 512,118 608,118" fill="#0D9488"/>
  <text x="560" y="104" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Reg</text>

  <polygon points="510,120 454,178 666,178 610,120" fill="#14B8A6"/>
  <text x="560" y="161" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">SRAM</text>

  <polygon points="452,180 368,268 752,268 668,180" fill="#5EEAD4"/>
  <text x="560" y="234" text-anchor="middle" font-size="28" font-weight="700" fill="#115E59"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">L2 Cache</text>

  <polygon points="366,270 234,410 886,410 754,270" fill="#FBBF24" opacity="0.85"/>
  <text x="560" y="330" text-anchor="middle" font-size="30" font-weight="700" fill="#78350F"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">HBM</text>

  <polygon points="232,412 90,556 1030,556 888,412" fill="#F87171" opacity="0.55"/>
  <text x="560" y="475" text-anchor="middle" font-size="30" font-weight="700" fill="#7F1D1D"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">RAM</text>

  <!-- E3 in L2 — dim -->
  <rect x="522" y="236" width="76" height="30" rx="7" fill="#115E59" opacity="0.3"/>
  <text x="560" y="259" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF" opacity="0.8"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₃</text>

  <!-- Experts in HBM -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="340" y="352" width="76" height="34" rx="7" fill="#92400E" opacity="0.35"/>
    <text x="378" y="377" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF">E₁</text>
    <rect x="440" y="352" width="76" height="34" rx="7" fill="#92400E" opacity="0.35"/>
    <text x="478" y="377" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF">E₂</text>
    <rect x="540" y="352" width="76" height="34" rx="7" fill="#92400E" opacity="0.35"/>
    <text x="578" y="377" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF">E₅</text>
    <rect x="640" y="352" width="76" height="34" rx="7" fill="#92400E" opacity="0.35"/>
    <text x="678" y="377" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF">E₈</text>
    <rect x="380" y="392" width="60" height="10" rx="4" fill="#92400E" opacity="0.15"/>
    <rect x="463" y="392" width="60" height="10" rx="4" fill="#92400E" opacity="0.15"/>
    <rect x="546" y="392" width="60" height="10" rx="4" fill="#92400E" opacity="0.15"/>
    <rect x="629" y="392" width="60" height="10" rx="4" fill="#92400E" opacity="0.15"/>
  </g>

  <!-- Experts in RAM — E4 highlighted -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="260" y="510" width="76" height="34" rx="7" fill="#DC2626" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <text x="298" y="535" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">E₄</text>
    <rect x="356" y="510" width="76" height="34" rx="7" fill="#7F1D1D" opacity="0.25"/>
    <text x="394" y="535" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF" opacity="0.8">E₆</text>
    <rect x="452" y="510" width="76" height="34" rx="7" fill="#7F1D1D" opacity="0.25"/>
    <text x="490" y="535" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF" opacity="0.8">E₇</text>
    <rect x="548" y="510" width="76" height="34" rx="7" fill="#7F1D1D" opacity="0.25"/>
    <text x="586" y="535" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF" opacity="0.8">E₉</text>
    <rect x="644" y="510" width="76" height="34" rx="7" fill="#7F1D1D" opacity="0.25"/>
    <text x="682" y="535" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF" opacity="0.6">···</text>
    <rect x="740" y="510" width="76" height="34" rx="7" fill="#7F1D1D" opacity="0.25"/>
    <text x="778" y="535" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF" opacity="0.8">E₆₄</text>
  </g>

  <!-- ============ RIGHT SIDE: Speed scale ============ -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <line x1="610" y1="82" x2="1060" y2="82" stroke="#0D9488" stroke-width="1.5" opacity="0.3"/>
    <text x="1070" y="86" font-size="24" font-weight="700" fill="#0D9488">130 TB/s</text>
    <text x="1070" y="112" font-size="22" fill="#0D9488" opacity="0.6">64 KB</text>
    <line x1="668" y1="150" x2="1060" y2="150" stroke="#14B8A6" stroke-width="1.5" opacity="0.3"/>
    <text x="1070" y="154" font-size="24" font-weight="700" fill="#0F766E">33 TB/s</text>
    <text x="1070" y="178" font-size="22" fill="#0F766E" opacity="0.6">227 KB</text>
    <line x1="754" y1="224" x2="1060" y2="224" stroke="#0D9488" stroke-width="1.5" opacity="0.3"/>
    <text x="1070" y="228" font-size="24" font-weight="700" fill="#115E59">12 TB/s</text>
    <text x="1070" y="252" font-size="22" fill="#115E59" opacity="0.6">50 MB</text>
    <line x1="886" y1="340" x2="1060" y2="340" stroke="#92400E" stroke-width="1.5" opacity="0.3"/>
    <text x="1070" y="344" font-size="24" font-weight="700" fill="#92400E">3 TB/s</text>
    <text x="1070" y="368" font-size="22" fill="#92400E" opacity="0.6">80 GB</text>
    <line x1="990" y1="482" x2="1060" y2="482" stroke="#991B1B" stroke-width="1.5" opacity="0.3"/>
    <text x="1070" y="486" font-size="24" font-weight="700" fill="#991B1B">0.5 TB/s</text>
    <text x="1070" y="510" font-size="22" fill="#991B1B" opacity="0.6">1 TB</text>
  </g>

  <g transform="translate(1230, 76)">
    <text x="0" y="0" text-anchor="middle" font-size="22" font-weight="600" fill="#0D9488"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">fast</text>
    <line x1="0" y1="14" x2="0" y2="400" stroke="#94A3B8" stroke-width="2" opacity="0.4"/>
    <polygon points="-6,390 6,390 0,408" fill="#DC2626" opacity="0.5"/>
    <text x="0" y="428" text-anchor="middle" font-size="22" font-weight="600" fill="#DC2626"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">slow</text>
  </g>

  <!-- ============ TOKEN ============ -->
  <rect x="50" y="74" width="150" height="64" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="125" y="119" text-anchor="middle" font-size="36" font-weight="700" fill="#115E59"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">token</text>

  <!-- ============ ROUTER ============ -->
  <defs>
    <marker id="arr-grey2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="125" y1="138" x2="125" y2="174" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr-grey2)"/>

  <rect x="50" y="184" width="150" height="90" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="125" y="225" text-anchor="middle" font-size="32" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Router</text>
  <text x="125" y="256" text-anchor="middle" font-size="24" fill="#3B82F6"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">top-K</text>

  <text x="125" y="308" text-anchor="middle" font-size="28" font-weight="600" fill="#3B82F6"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">selects E₄</text>

  <!-- Arrow: Router → E4 in RAM — down left margin then right -->
  <path d="M 125 320 L 125 530 L 254 530"
        fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
</svg>
