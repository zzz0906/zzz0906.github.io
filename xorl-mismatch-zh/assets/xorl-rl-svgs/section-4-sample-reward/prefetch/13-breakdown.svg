<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- ============ HEADER BAR ============ -->
  <rect x="0" y="0" width="750" height="42" fill="#2563EB"/>
  <rect x="738" y="0" width="24" height="42" rx="12" fill="#2563EB"/>
  <text x="24" y="29" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">Speculating Experts Accelerates Inference for Mixture-of-Experts</text>

  <!-- ============ LEFT SIDE ============ -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="60" y="160" font-size="56" font-weight="800" fill="#1a1a1a">Time Per</text>
    <text x="60" y="224" font-size="56" font-weight="800" fill="#1a1a1a">Output Token</text>
    <text x="60" y="290" font-size="36" fill="#64748B">GH200</text>
    <text x="60" y="560" font-size="36" font-weight="600" fill="#475569">Qwen3-235B</text>
    <text x="60" y="602" font-size="36" font-weight="600" fill="#475569">-A22B</text>
  </g>

  <!-- ============ STACKED BAR (x=520, y=66 to y=660) ============ -->
  <!-- Compute (teal): ~6% = 36px -->
  <rect x="520" y="66" width="300" height="36" rx="12" fill="#0D9488"/>
  <rect x="520" y="88" width="300" height="14" fill="#0D9488"/>
  <!-- Overhead (grey): ~6% = 36px -->
  <rect x="520" y="102" width="300" height="36" fill="#CBD5E1"/>
  <!-- Expert fetch (red): ~88% = 522px -->
  <rect x="520" y="138" width="300" height="522" fill="#DC2626"/>
  <rect x="520" y="640" width="300" height="20" rx="12" fill="#DC2626"/>

  <!-- ============ LABELS — large, right of bar ============ -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <line x1="825" y1="84" x2="855" y2="84" stroke="#0D9488" stroke-width="2.5"/>
    <text x="868" y="94" font-size="40" font-weight="700" fill="#0D9488">Compute</text>

    <line x1="825" y1="400" x2="855" y2="400" stroke="#DC2626" stroke-width="2.5"/>
    <text x="868" y="410" font-size="40" font-weight="700" fill="#DC2626">Expert Fetch</text>
  </g>
</svg>
