<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- ============ HEADER BAR ============ -->
  <rect x="0" y="0" width="750" height="42" fill="#2563EB"/>
  <rect x="738" y="0" width="24" height="42" rx="12" fill="#2563EB"/>
  <text x="24" y="29" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">Speculating Experts Accelerates Inference for Mixture-of-Experts</text>

  <!-- ============ LAYER l ============ -->
  <rect x="20" y="56" width="600" height="340" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="52" y="108" font-size="48" font-weight="700" fill="#475569"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Layer l</text>

  <rect x="48" y="170" width="170" height="100" rx="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <text x="133" y="232" text-anchor="middle" font-size="36" font-weight="600" fill="#475569"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Attn</text>

  <rect x="240" y="170" width="170" height="100" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="325" y="232" text-anchor="middle" font-size="36" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Router</text>

  <rect x="432" y="162" width="160" height="116" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="512" y="233" text-anchor="middle" font-size="40" font-weight="700" fill="#115E59"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">MoE</text>

  <!-- ============ LAYER l+1 ============ -->
  <rect x="660" y="56" width="600" height="340" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="692" y="108" font-size="48" font-weight="700" fill="#475569"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Layer l+1</text>

  <rect x="688" y="170" width="170" height="100" rx="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <text x="773" y="232" text-anchor="middle" font-size="36" font-weight="600" fill="#475569"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Attn</text>

  <rect x="880" y="170" width="170" height="100" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="965" y="232" text-anchor="middle" font-size="36" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Router</text>

  <rect x="1072" y="162" width="160" height="116" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="1152" y="233" text-anchor="middle" font-size="40" font-weight="700" fill="#115E59"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">MoE</text>

  <!-- ============ PREDICTION PATH ============ -->

  <!-- Dashed teal line from Attn in layer l down -->
  <line x1="133" y1="270" x2="133" y2="490" stroke="#0D9488" stroke-width="3" stroke-dasharray="8,5"/>

  <!-- Arrow into Predict box -->
  <line x1="133" y1="490" x2="238" y2="530" stroke="#0D9488" stroke-width="3" marker-end="url(#arr-teal)"/>

  <!-- Predict Experts box -->
  <rect x="250" y="498" width="360" height="76" rx="14" fill="#0D9488"/>
  <text x="430" y="548" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Predict Experts (l+1)</text>

  <!-- Arrow out to expert pills -->
  <line x1="610" y1="536" x2="658" y2="536" stroke="#0D9488" stroke-width="3" marker-end="url(#arr-teal)"/>

  <!-- Predicted expert pills -->
  <rect x="668" y="506" width="96" height="60" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="716" y="548" text-anchor="middle" font-size="34" font-weight="700" fill="#115E59"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₃</text>

  <rect x="776" y="506" width="96" height="60" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="824" y="548" text-anchor="middle" font-size="34" font-weight="700" fill="#115E59"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₇</text>

  <!-- ============ BIG PREFETCH ARROW ============ -->
  <!-- Curve from pills up to MoE l+1 bottom (1152, 278) -->
  <!-- Tangent at end: (52, -62), unit (0.643, -0.766) -->
  <!-- Arrowhead: tip=(1152,278), base back 22px, width ±12px -->
  <path d="M 872 510 C 980 440, 1100 340, 1140 295"
        fill="none" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
  <polygon points="1152,278 1147,303 1129,287" fill="#0D9488"/>

  <!-- "prefetch" label -->
  <text x="1010" y="540" text-anchor="middle" font-size="40" font-weight="700" fill="#0D9488" font-style="italic"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">prefetch</text>
</svg>
