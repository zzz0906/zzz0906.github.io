<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- ======== TOP HALF (pixel-identical with 22-kernel) ======== -->

  <!-- Tenant A (L₀) — blue family -->
  <text x="220" y="68" text-anchor="middle" font-size="34" font-weight="700" fill="#2563EB"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">LoRA 0</text>

  <!-- Boxes: 140×48, rx=12, font=30 → y = box_y + 24 + 11 = box_y + 35 -->

  <!-- "The" (E1) y=90 -->
  <rect x="150" y="90" width="140" height="48" rx="12" fill="#2563EB"/>
  <text x="220" y="125" text-anchor="middle"
        font-size="30" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">The</text>

  <!-- "cat" (E2) y=148 -->
  <rect x="150" y="148" width="140" height="48" rx="12" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="220" y="183" text-anchor="middle"
        font-size="30" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">cat</text>

  <!-- "sat" (E1) y=206 -->
  <rect x="150" y="206" width="140" height="48" rx="12" fill="#2563EB"/>
  <text x="220" y="241" text-anchor="middle"
        font-size="30" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">sat</text>

  <!-- "on" (E2) y=264 -->
  <rect x="150" y="264" width="140" height="48" rx="12" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="220" y="299" text-anchor="middle"
        font-size="30" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">on</text>

  <!-- Tenant B (L₁) — purple family -->
  <text x="490" y="68" text-anchor="middle" font-size="34" font-weight="700" fill="#7C3AED"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">LoRA 1</text>

  <!-- "My" (E1) y=90 -->
  <rect x="420" y="90" width="140" height="48" rx="12" fill="#7C3AED"/>
  <text x="490" y="125" text-anchor="middle"
        font-size="30" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">My</text>

  <!-- "name" (E1) y=148 -->
  <rect x="420" y="148" width="140" height="48" rx="12" fill="#7C3AED"/>
  <text x="490" y="183" text-anchor="middle"
        font-size="30" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">name</text>

  <!-- "is" (E2) y=206 -->
  <rect x="420" y="206" width="140" height="48" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="490" y="241" text-anchor="middle"
        font-size="30" font-weight="600" fill="#5B21B6"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">is</text>

  <!-- "Bob" (E2) y=264 -->
  <rect x="420" y="264" width="140" height="48" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="490" y="299" text-anchor="middle"
        font-size="30" font-weight="600" fill="#5B21B6"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">Bob</text>

  <!-- Legend -->
  <!-- Swatches: 28×28, font=28 → text y = swatch_y + 14 + 10 = swatch_y + 24 -->
  <rect x="720" y="110" width="28" height="28" rx="7" fill="#2563EB"/>
  <rect x="754" y="110" width="28" height="28" rx="7" fill="#7C3AED"/>
  <text x="798" y="134" font-size="28" font-weight="600" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Expert 1</text>

  <rect x="720" y="156" width="28" height="28" rx="7" fill="#BFDBFE" stroke="#2563EB" stroke-width="1"/>
  <rect x="754" y="156" width="28" height="28" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="798" y="180" font-size="28" font-weight="600" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Expert 2</text>

  <!-- ======== BOTTOM HALF: Fragmented buffer (21 only) ======== -->

  <!-- Downward arrow from tokens to buffer -->
  <line x1="350" y1="330" x2="350" y2="380" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <polygon points="339,382 350,403 361,382" fill="#64748B"/>

  <!-- Container bar -->
  <rect x="60" y="420" width="1160" height="90" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 8 interleaved token blocks: 110×54, rx=10 -->
  <!-- font=26 → y = block_y + 27 + 9 = block_y + 36 -->
  <!-- Order: The(E1L0), My(E1L1), cat(E2L0), is(E2L1), sat(E1L0), name(E1L1), on(E2L0), Bob(E2L1) -->

  <!-- Block 1: The (E1,L0) — solid blue -->
  <rect x="78" y="438" width="110" height="54" rx="10" fill="#2563EB"/>
  <text x="133" y="474" text-anchor="middle"
        font-size="26" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">The</text>

  <!-- Block 2: My (E1,L1) — solid purple -->
  <rect x="208" y="438" width="110" height="54" rx="10" fill="#7C3AED"/>
  <text x="263" y="474" text-anchor="middle"
        font-size="26" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">My</text>

  <!-- Block 3: cat (E2,L0) — light blue -->
  <rect x="338" y="438" width="110" height="54" rx="10" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="393" y="474" text-anchor="middle"
        font-size="26" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">cat</text>

  <!-- Block 4: is (E2,L1) — light purple -->
  <rect x="468" y="438" width="110" height="54" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="523" y="474" text-anchor="middle"
        font-size="26" font-weight="600" fill="#5B21B6"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">is</text>

  <!-- Block 5: sat (E1,L0) — solid blue -->
  <rect x="598" y="438" width="110" height="54" rx="10" fill="#2563EB"/>
  <text x="653" y="474" text-anchor="middle"
        font-size="26" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">sat</text>

  <!-- Block 6: name (E1,L1) — solid purple -->
  <rect x="728" y="438" width="110" height="54" rx="10" fill="#7C3AED"/>
  <text x="783" y="474" text-anchor="middle"
        font-size="26" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">name</text>

  <!-- Block 7: on (E2,L0) — light blue -->
  <rect x="858" y="438" width="110" height="54" rx="10" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="913" y="474" text-anchor="middle"
        font-size="26" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">on</text>

  <!-- Block 8: Bob (E2,L1) — light purple -->
  <rect x="988" y="438" width="110" height="54" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1043" y="474" text-anchor="middle"
        font-size="26" font-weight="600" fill="#5B21B6"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">Bob</text>

  <!-- Red dashed boundary lines at every (expert,lora) context switch — 7 total -->
  <!-- These visually communicate the fragmentation problem -->
  <line x1="193" y1="428" x2="193" y2="502" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="323" y1="428" x2="323" y2="502" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="453" y1="428" x2="453" y2="502" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="583" y1="428" x2="583" y2="502" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="713" y1="428" x2="713" y2="502" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="843" y1="428" x2="843" y2="502" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="973" y1="428" x2="973" y2="502" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Red ticks below boundary lines to reinforce fragmentation count -->
  <line x1="193" y1="516" x2="193" y2="530" stroke="#DC2626" stroke-width="3"/>
  <line x1="323" y1="516" x2="323" y2="530" stroke="#DC2626" stroke-width="3"/>
  <line x1="453" y1="516" x2="453" y2="530" stroke="#DC2626" stroke-width="3"/>
  <line x1="583" y1="516" x2="583" y2="530" stroke="#DC2626" stroke-width="3"/>
  <line x1="713" y1="516" x2="713" y2="530" stroke="#DC2626" stroke-width="3"/>
  <line x1="843" y1="516" x2="843" y2="530" stroke="#DC2626" stroke-width="3"/>
  <line x1="973" y1="516" x2="973" y2="530" stroke="#DC2626" stroke-width="3"/>

</svg>
