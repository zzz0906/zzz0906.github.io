<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- ===== LEFT: Interleaved tokens ===== -->

  <rect x="80" y="148" width="190" height="62" rx="14" fill="#2563EB"/>
  <text x="175" y="191" text-anchor="middle"
        font-size="34" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">The</text>

  <rect x="80" y="226" width="190" height="62" rx="14" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/>
  <text x="175" y="269" text-anchor="middle"
        font-size="34" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">cat</text>

  <rect x="80" y="304" width="190" height="62" rx="14" fill="#2563EB"/>
  <text x="175" y="347" text-anchor="middle"
        font-size="34" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">sat</text>

  <rect x="80" y="382" width="190" height="62" rx="14" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/>
  <text x="175" y="425" text-anchor="middle"
        font-size="34" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">on</text>

  <!-- "interleaved" label — red -->
  <text x="175" y="486" text-anchor="middle" font-size="40" font-weight="600" fill="#DC2626"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">interleaved</text>

  <!-- ===== ARROW: scatter ===== -->
  <line x1="310" y1="325" x2="490" y2="325" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <polygon points="494,312 520,325 494,338" fill="#64748B"/>
  <text x="400" y="295" text-anchor="middle" font-size="40" font-weight="600" fill="#64748B"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">scatter</text>

  <!-- ===== RIGHT: Contiguous blocks ===== -->

  <!-- "Expert 1" label above E1 container -->
  <text x="870" y="130" text-anchor="middle" font-size="40" font-weight="700" fill="#2563EB"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Expert 1</text>

  <!-- E1 container -->
  <rect x="560" y="152" width="620" height="78" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="572" y="162" width="280" height="58" rx="12" fill="#2563EB"/>
  <text x="712" y="203" text-anchor="middle"
        font-size="34" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">The</text>
  <rect x="862" y="162" width="280" height="58" rx="12" fill="#2563EB"/>
  <text x="1002" y="203" text-anchor="middle"
        font-size="34" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">sat</text>

  <!-- "contiguous" label — green -->
  <text x="870" y="300" text-anchor="middle" font-size="40" font-weight="600" fill="#16A34A"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">contiguous</text>

  <!-- E2 container -->
  <rect x="560" y="368" width="620" height="78" rx="16" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
  <rect x="572" y="378" width="280" height="58" rx="12" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="712" y="419" text-anchor="middle"
        font-size="34" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">cat</text>
  <rect x="862" y="378" width="280" height="58" rx="12" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1002" y="419" text-anchor="middle"
        font-size="34" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">on</text>

  <!-- "Expert 2" label below E2 container -->
  <text x="870" y="490" text-anchor="middle" font-size="40" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Expert 2</text>
</svg>
