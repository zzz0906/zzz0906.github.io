<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- Legend (top-right) -->
  <!-- Swatches 32×32, font=28 → text y = swatch_y + 16 + 10 = swatch_y + 26 -->
  <rect x="920" y="38" width="32" height="32" rx="8" fill="#2563EB"/>
  <rect x="958" y="38" width="32" height="32" rx="8" fill="#7C3AED"/>
  <text x="1008" y="64" font-size="28" font-weight="600" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Expert 1</text>

  <rect x="920" y="84" width="32" height="32" rx="8" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="958" y="84" width="32" height="32" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1008" y="110" font-size="28" font-weight="600" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Expert 2</text>

  <!-- Sort key label — 40px -->
  <text x="440" y="72" text-anchor="middle" font-size="40" font-weight="600" fill="#64748B"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">sort by (expert_id, lora_id)</text>

  <!-- Downward arrow -->
  <line x1="440" y1="92" x2="440" y2="140" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <polygon points="428,142 440,165 452,142" fill="#64748B"/>

  <!-- ===== CONTAINER BAR ===== -->
  <rect x="50" y="185" width="1180" height="210" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 4 segments: each ~272×180 -->
  <!-- Inner token blocks: 120×70, font=34 → y = inner_y + 35 + 12 = inner_y + 47 -->
  <!-- Sublabels: font=28 -->

  <!-- === E1, L0 segment: x=66 === -->
  <rect x="66" y="200" width="272" height="180" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <rect x="82" y="215" width="120" height="70" rx="10" fill="#2563EB"/>
  <text x="142" y="262" text-anchor="middle"
        font-size="34" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">The</text>
  <rect x="210" y="215" width="120" height="70" rx="10" fill="#2563EB"/>
  <text x="270" y="262" text-anchor="middle"
        font-size="34" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">sat</text>
  <text x="202" y="345" text-anchor="middle" font-size="28" fill="#2563EB"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">E&#8321; , L&#8320;</text>

  <!-- === E1, L1 segment: x=352 === -->
  <rect x="352" y="200" width="272" height="180" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="368" y="215" width="120" height="70" rx="10" fill="#7C3AED"/>
  <text x="428" y="262" text-anchor="middle"
        font-size="34" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">My</text>
  <rect x="496" y="215" width="120" height="70" rx="10" fill="#7C3AED"/>
  <text x="556" y="262" text-anchor="middle"
        font-size="34" font-weight="600" fill="white"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">name</text>
  <text x="488" y="345" text-anchor="middle" font-size="28" fill="#7C3AED"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">E&#8321; , L&#8321;</text>

  <!-- === E2, L0 segment: x=638 === -->
  <rect x="638" y="200" width="272" height="180" rx="14" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
  <rect x="654" y="215" width="120" height="70" rx="10" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="714" y="262" text-anchor="middle"
        font-size="34" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">cat</text>
  <rect x="782" y="215" width="120" height="70" rx="10" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="842" y="262" text-anchor="middle"
        font-size="34" font-weight="600" fill="#1E40AF"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">on</text>
  <text x="774" y="345" text-anchor="middle" font-size="28" fill="#2563EB"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">E&#8322; , L&#8320;</text>

  <!-- === E2, L1 segment: x=924 === -->
  <rect x="924" y="200" width="272" height="180" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="940" y="215" width="120" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1000" y="262" text-anchor="middle"
        font-size="34" font-weight="600" fill="#5B21B6"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">is</text>
  <rect x="1068" y="215" width="120" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1128" y="262" text-anchor="middle"
        font-size="34" font-weight="600" fill="#5B21B6"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">Bob</text>
  <text x="1060" y="345" text-anchor="middle" font-size="28" fill="#7C3AED"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">E&#8322; , L&#8321;</text>

  <!-- ===== BRACKETS ===== -->

  <!-- Expert 1 bracket -->
  <line x1="66" y1="420" x2="66" y2="448" stroke="#2563EB" stroke-width="3.5"/>
  <line x1="66" y1="448" x2="624" y2="448" stroke="#2563EB" stroke-width="3.5"/>
  <line x1="624" y1="420" x2="624" y2="448" stroke="#2563EB" stroke-width="3.5"/>
  <text x="345" y="495" text-anchor="middle" font-size="36" font-weight="700" fill="#2563EB"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Expert 1</text>

  <!-- Expert 2 bracket -->
  <line x1="638" y1="420" x2="638" y2="448" stroke="#2563EB" stroke-width="3.5"/>
  <line x1="638" y1="448" x2="1196" y2="448" stroke="#2563EB" stroke-width="3.5"/>
  <line x1="1196" y1="420" x2="1196" y2="448" stroke="#2563EB" stroke-width="3.5"/>
  <text x="917" y="495" text-anchor="middle" font-size="36" font-weight="700" fill="#2563EB"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Expert 2</text>

  <!-- Purple adapter boundary ticks -->
  <line x1="345" y1="416" x2="345" y2="446" stroke="#7C3AED" stroke-width="4"/>
  <line x1="917" y1="416" x2="917" y2="446" stroke="#7C3AED" stroke-width="4"/>
</svg>
