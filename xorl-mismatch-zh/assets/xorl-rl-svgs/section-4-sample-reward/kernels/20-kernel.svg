<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- Step labels — 36px bold -->
  <text x="430" y="72" text-anchor="middle" font-size="36" font-weight="700" fill="#64748B"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Step 1</text>
  <text x="710" y="72" text-anchor="middle" font-size="36" font-weight="700" fill="#64748B"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Step 2</text>
  <text x="990" y="72" text-anchor="middle" font-size="36" font-weight="700" fill="#64748B"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Step 3</text>

  <!-- Lane labels — 36px bold -->
  <text x="155" y="180" text-anchor="middle" font-size="36" font-weight="700" fill="#2D3748"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Buffer A</text>
  <text x="155" y="360" text-anchor="middle" font-size="36" font-weight="700" fill="#2D3748"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Buffer B</text>

  <!-- Cells: 240×90, rx=16 -->
  <!-- font=36 → y = box_y + 45 + 13 = box_y + 58 -->

  <!-- ===== BUFFER A ROW (y=135) ===== -->

  <!-- Step 1: Load -->
  <rect x="310" y="135" width="240" height="90" rx="16"
        fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="430" y="193" text-anchor="middle"
        font-size="36" font-weight="600" fill="#94A3B8"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Load</text>

  <!-- Step 2: Compute -->
  <rect x="590" y="135" width="240" height="90" rx="16" fill="#3B82F6"/>
  <text x="710" y="193" text-anchor="middle"
        font-size="36" font-weight="700" fill="white"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Compute</text>

  <!-- Step 3: Load -->
  <rect x="870" y="135" width="240" height="90" rx="16"
        fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="990" y="193" text-anchor="middle"
        font-size="36" font-weight="600" fill="#94A3B8"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Load</text>

  <!-- ===== BUFFER B ROW (y=315) ===== -->

  <!-- Step 1: idle -->
  <rect x="310" y="315" width="240" height="90" rx="16"
        fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="430" y="373" text-anchor="middle"
        font-size="36" fill="#CBD5E1"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">&#8212;</text>

  <!-- Step 2: Load -->
  <rect x="590" y="315" width="240" height="90" rx="16"
        fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="710" y="373" text-anchor="middle"
        font-size="36" font-weight="600" fill="#94A3B8"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Load</text>

  <!-- Step 3: Compute -->
  <rect x="870" y="315" width="240" height="90" rx="16" fill="#3B82F6"/>
  <text x="990" y="373" text-anchor="middle"
        font-size="36" font-weight="700" fill="white"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Compute</text>

  <!-- Continuation dots -->
  <circle cx="1150" cy="180" r="8" fill="#94A3B8"/>
  <circle cx="1182" cy="180" r="8" fill="#94A3B8"/>
  <circle cx="1214" cy="180" r="8" fill="#94A3B8"/>
  <circle cx="1150" cy="360" r="8" fill="#94A3B8"/>
  <circle cx="1182" cy="360" r="8" fill="#94A3B8"/>
  <circle cx="1214" cy="360" r="8" fill="#94A3B8"/>

  <!-- Thin horizontal separator -->
  <line x1="300" y1="260" x2="1130" y2="260" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ===== FULL-WIDTH FLOW LABEL — 44px ===== -->
  <text x="640" y="540" text-anchor="middle" font-size="44"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
    <tspan fill="#94A3B8">HBM</tspan>
    <tspan fill="#CBD5E1"> &#x2500; </tspan>
    <tspan fill="#94A3B8">load</tspan>
    <tspan fill="#CBD5E1"> &#x2500;&#x25B8; </tspan>
    <tspan fill="#2563EB" font-weight="700">SRAM</tspan>
    <tspan fill="#CBD5E1"> &#x2500; </tspan>
    <tspan fill="#3B82F6" font-weight="600">compute</tspan>
    <tspan fill="#CBD5E1"> &#x2500;&#x25B8; </tspan>
    <tspan fill="#94A3B8">output</tspan>
  </text>
</svg>
