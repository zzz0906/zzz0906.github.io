<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1280" height="720" fill="#f8f9fa" opacity="0.5"/>

  <text x="50" y="80" font-size="64" font-weight="800" fill="#7b61ff">Sync</text>

  <!-- π_train (left) -->
  <g transform="translate(65, 140)">
    <rect x="0" y="0" width="300" height="300" rx="20" fill="#fff" stroke="#1a73e8" stroke-width="3.5"/>
    <text x="150" y="168" text-anchor="middle" font-size="76" fill="#1a73e8" font-weight="800">π<tspan dy="18" font-size="50">train</tspan></text>
  </g>
  <text x="215" y="485" text-anchor="middle" font-size="38" fill="#1a73e8" font-weight="600">Training</text>
  <text x="215" y="530" text-anchor="middle" font-size="38" fill="#1a73e8" font-weight="600">Engine</text>

  <!-- Transfer arrow -->
  <line x1="400" y1="290" x2="850" y2="290" stroke="#7b61ff" stroke-width="8"/>
  <polygon points="850,268 900,290 850,312" fill="#7b61ff"/>

  <!-- θ_{t+1} above arrow -->
  <text x="625" y="245" text-anchor="middle" font-size="64" fill="#7b61ff" font-weight="700">θ<tspan dy="14" font-size="42">t+1</tspan></text>

  <!-- "New weights" below arrow -->
  <text x="625" y="355" text-anchor="middle" font-size="40" fill="#7b61ff" font-weight="600">New weights</text>

  <!-- π_infer (right) -->
  <g transform="translate(915, 140)">
    <rect x="0" y="0" width="300" height="300" rx="20" fill="#fff" stroke="#1a73e8" stroke-width="3.5"/>
    <text x="150" y="168" text-anchor="middle" font-size="76" fill="#1a73e8" font-weight="800">π<tspan dy="18" font-size="50">infer</tspan></text>
  </g>
  <text x="1065" y="485" text-anchor="middle" font-size="38" fill="#1a73e8" font-weight="600">Inference</text>
  <text x="1065" y="530" text-anchor="middle" font-size="38" fill="#1a73e8" font-weight="600">Engine</text>

  <!-- Progress bar -->
</svg>
