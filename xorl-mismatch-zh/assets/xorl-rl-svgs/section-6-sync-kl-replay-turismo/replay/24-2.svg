<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="replayGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FAFAFA"/>


  <!-- ============ LHS: INFERENCE ============ -->
  <text x="340" y="110" text-anchor="middle" font-size="44" font-weight="700" fill="#2563EB"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Inference</text>

  <!-- FP32 Router -->
  <rect x="220" y="135" width="240" height="58" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <rect x="220" y="135" width="240" height="58" rx="12" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="340" y="172" text-anchor="middle" font-size="30" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">FP32 Router</text>

  <line x1="340" y1="193" x2="340" y2="228" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Logit bars -->
  <rect x="222" y="255" width="50" height="150" rx="4" fill="#BFDBFE" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="284" y="365" width="50" height="40"  rx="4" fill="#DBEAFE" stroke="#3b82f6" stroke-width="1"/>
  <rect x="346" y="285" width="50" height="120" rx="4" fill="#BFDBFE" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="408" y="373" width="50" height="32"  rx="4" fill="#DBEAFE" stroke="#3b82f6" stroke-width="1"/>

  <!-- Arrow down to Replay Buffer -->
  <line x1="340" y1="415" x2="340" y2="460" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- ============ REPLAY BUFFER ============ -->
  <rect x="210" y="470" width="860" height="60" rx="14" fill="url(#replayGrad)"/>
  <text x="640" y="509" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Replay Buffer</text>

  <!-- Arrow up from Replay Buffer to Training -->
  <line x1="940" y1="470" x2="940" y2="420" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- ============ RHS: TRAINING ============ -->
  <text x="940" y="110" text-anchor="middle" font-size="44" font-weight="700" fill="#ea580c"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Training</text>

  <!-- Dimmed/crossed-out local router -->
  <g opacity="0.25">
    <rect x="820" y="135" width="240" height="58" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="940" y="172" text-anchor="middle" font-size="30" font-weight="700" fill="#9a3412"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Router</text>
  </g>
  <line x1="830" y1="142" x2="1050" y2="186" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
  <line x1="1050" y1="142" x2="830" y2="186" stroke="#ef4444" stroke-width="2" opacity="0.4"/>

  <line x1="940" y1="193" x2="940" y2="228" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- Replayed logit bars (purple tint) -->
  <rect x="822" y="255" width="50" height="150" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="884" y="365" width="50" height="40"  rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <rect x="946" y="285" width="50" height="120" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="1008" y="373" width="50" height="32"  rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>

</svg>