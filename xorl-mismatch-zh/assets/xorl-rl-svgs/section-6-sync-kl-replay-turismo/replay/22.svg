<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FAFAFA"/>


  <line x1="640" y1="80" x2="640" y2="650" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============ LHS: INFERENCE ============ -->
  <text x="310" y="115" text-anchor="middle" font-size="44" font-weight="700" fill="#2563EB"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Inference</text>

  <!-- Blue Router -->
  <rect x="230" y="140" width="160" height="54" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="310" y="174" text-anchor="middle" font-size="28" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Router</text>

  <line x1="310" y1="194" x2="310" y2="230" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- E₁: height 340 -->
    <rect x="123" y="280" width="80" height="340" rx="6" fill="#BFDBFE" stroke="#3b82f6" stroke-width="2"/>
    <!-- E₂: height 55 -->
    <rect x="221" y="565" width="80" height="55" rx="6" fill="#DBEAFE" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
    <!-- E₃: height 130 — RED OUTLINE -->
    <rect x="319" y="490" width="80" height="130" rx="6" fill="#BFDBFE" stroke="#ef4444" stroke-width="3"/>
    <!-- E₄: height 35 -->
    <rect x="417" y="585" width="80" height="35" rx="6" fill="#DBEAFE" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>

    <text x="163" y="648" text-anchor="middle" font-size="26" font-weight="600" fill="#1E40AF">E₁</text>
    <text x="261" y="648" text-anchor="middle" font-size="26" font-weight="600" fill="#1E40AF">E₂</text>
    <text x="359" y="648" text-anchor="middle" font-size="26" font-weight="600" fill="#ef4444">E₃</text>
    <text x="457" y="648" text-anchor="middle" font-size="26" font-weight="600" fill="#1E40AF">E₄</text>
  </g>

  <!-- ============ RHS: TRAINING ============ -->
  <text x="970" y="115" text-anchor="middle" font-size="44" font-weight="700" fill="#ea580c"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Training</text>

  <!-- Orange Router -->
  <rect x="890" y="140" width="160" height="54" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="970" y="174" text-anchor="middle" font-size="28" font-weight="700" fill="#9a3412"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Router</text>

  <line x1="970" y1="194" x2="970" y2="230" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- E₁: height 340 -->
    <rect x="783" y="280" width="80" height="340" rx="6" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
    <!-- E₂: height 50 -->
    <rect x="881" y="570" width="80" height="50" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" opacity="0.7"/>
    <!-- E₃: height 260 — RED OUTLINE -->
    <rect x="979" y="360" width="80" height="260" rx="6" fill="#fed7aa" stroke="#ef4444" stroke-width="3"/>
    <!-- E₄: height 30 -->
    <rect x="1077" y="590" width="80" height="30" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" opacity="0.7"/>

    <text x="823" y="648" text-anchor="middle" font-size="26" font-weight="600" fill="#9a3412">E₁</text>
    <text x="921" y="648" text-anchor="middle" font-size="26" font-weight="600" fill="#9a3412">E₂</text>
    <text x="1019" y="648" text-anchor="middle" font-size="26" font-weight="600" fill="#ef4444">E₃</text>
    <text x="1117" y="648" text-anchor="middle" font-size="26" font-weight="600" fill="#9a3412">E₄</text>
  </g>
</svg>
