<text x="995" y="570" text-anchor="middle" font-size="40" font-weight="800" fill="#1a73e8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Train</text>

<!-- US inference (pixel-verified: img(285,165)->SVG(325,190), img(260,180)->SVG(300,204)) -->
<circle cx="325" cy="190" r="14" fill="#0d904f" stroke="white" stroke-width="2.5"/>
