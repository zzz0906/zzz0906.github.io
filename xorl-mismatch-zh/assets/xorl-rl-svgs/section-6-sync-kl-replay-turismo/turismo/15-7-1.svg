<text x="1195" y="370" text-anchor="middle" font-size="26" font-weight="400" fill="#7b61ff" opacity="0.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">NVFP4</text>

<!-- 99%+ sparsity -->
<path d="M 580,390 L 580,450" fill="none" stroke="#0d904f" stroke-width="1.5" opacity="0.3"/>
<rect x="400" y="470" width="360" height="52" rx="26" fill="#0d904f" fill-opacity="0.10" stroke="#0d904f" stroke-width="2"/>
<text x="580" y="506" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#0d904f">99%+ sparsity</text>

