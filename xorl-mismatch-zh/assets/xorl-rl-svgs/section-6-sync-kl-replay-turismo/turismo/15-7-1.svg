<text x="805" y="375" text-anchor="middle" font-size="26" font-weight="600" fill="#b8860b" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Internet</text>

<line x1="885" y1="325" x2="939" y2="325" stroke="#64748B" stroke-width="4.5"/>
<polygon points="939,318 951,325 939,332" fill="#64748B"/>

<!-- Scatter -->
<rect x="955" y="265" width="150" height="120" rx="16" fill="#0d904f" opacity="0.08" stroke="#0d904f" stroke-width="2"/>
<text x="1030" y="335" text-anchor="middle" font-size="36" font-weight="700" fill="#0d904f" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Scatter</text>

<line x1="1108" y1="325" x2="1130" y2="325" stroke="#64748B" stroke-width="4.5"/>
