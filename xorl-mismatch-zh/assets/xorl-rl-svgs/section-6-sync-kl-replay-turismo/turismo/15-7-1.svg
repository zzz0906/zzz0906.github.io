<text x="125" y="370" text-anchor="middle" font-size="26" font-weight="400" fill="#1a73e8" opacity="0.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">FP32</text>

<line x1="220" y1="325" x2="274" y2="325" stroke="#64748B" stroke-width="4.5"/>
