<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FAFAFA"/>

  <!-- 1. Sample -->
  <g transform="translate(15, 20)">
    <rect x="0" y="0" width="285" height="640" rx="16" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="3"/>
    <text x="142" y="62" text-anchor="middle" font-size="56" font-weight="800" fill="#2563EB">Sample</text>
  </g>

  <polygon points="310,360 310,390 340,375" fill="#64748B" opacity="0.35"/>

  <!-- 2. Reward -->
  <g transform="translate(350, 20)">
    <rect x="0" y="0" width="230" height="640" rx="16" fill="#D97706" fill-opacity="0.08" stroke="#D97706" stroke-width="3"/>
    <text x="115" y="62" text-anchor="middle" font-size="56" font-weight="800" fill="#D97706">Reward</text>
  </g>

  <polygon points="590,360 590,390 620,375" fill="#64748B" opacity="0.35"/>

  <!-- 3. Train -->
  <g transform="translate(630, 20)">
    <rect x="0" y="0" width="250" height="640" rx="16" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="3"/>
    <text x="125" y="62" text-anchor="middle" font-size="56" font-weight="800" fill="#2563EB">Train</text>
  </g>

  <polygon points="890,360 890,390 920,375" fill="#64748B" opacity="0.35"/>

  <!-- 4. Sync -->
  <g transform="translate(930, 20)">
    <rect x="0" y="0" width="325" height="640" rx="16" fill="#7C3AED" fill-opacity="0.08" stroke="#7C3AED" stroke-width="3"/>
    <text x="162" y="62" text-anchor="middle" font-size="56" font-weight="800" fill="#7C3AED">Sync</text>
  </g>
</svg>
