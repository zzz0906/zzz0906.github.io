    <text x="640" y="374" text-anchor="middle" font-size="26" font-weight="700" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Gradients</text>
  </g>

  <!-- 4 GPU boxes below -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="478" y="440" width="76" height="56" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="516" y="477" text-anchor="middle" font-size="24" font-weight="600" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">GPU</text>

    <rect x="566" y="440" width="76" height="56" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="604" y="477" text-anchor="middle" font-size="24" font-weight="600" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">GPU</text>

    <rect x="654" y="440" width="76" height="56" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="692" y="477" text-anchor="middle" font-size="24" font-weight="600" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">GPU</text>

    <rect x="742" y="440" width="76" height="56" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="780" y="477" text-anchor="middle" font-size="24" font-weight="600" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">GPU</text>
  </g>

  <!-- ============ COLUMN 3: STABILITY (dim) ============ -->
  <g opacity="0.15">
    <text x="1067" y="80" text-anchor="middle" font-size="48" font-weight="700" fill="#0369A1"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Stability</text>
    <line x1="910" y1="540" x2="1250" y2="540" stroke="#64748B" stroke-width="2.5"/>
    <line x1="910" y1="110" x2="910" y2="540" stroke="#64748B" stroke-width="2.5"/>
    <path d="M920,140 L940,170 L955,125 L975,200 L990,150 L1005,240 L1020,170 L1035,280 L1050,200 L1060,155 L1075,310 L1088,230 L1098,370 L1108,270 L1118,330 L1128,290 L1138,410 L1148,320 L1158,370 L1165,350 L1175,440 L1185,370 L1195,400 L1202,385 L1212,450 L1220,410 L1230,430 L1240,425"
          stroke="#0369A1" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ PROGRESS BAR ============ -->
  <g transform="translate(370, 580)" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="150" height="44" rx="14" fill="#F1F5F9" opacity="0.4"/>
    <text x="75" y="32" text-anchor="middle" font-size="28" font-weight="700" fill="#94A3B8" opacity="0.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Kernels</text>

    <text x="178" y="32" text-anchor="middle" font-size="28" fill="#94A3B8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">▸</text>

    <rect x="200" y="0" width="190" height="44" rx="14" fill="#CCFBF1"/>
    <text x="295" y="32" text-anchor="middle" font-size="28" font-weight="700" fill="#0D9488" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Parallelism</text>

    <text x="418" y="32" text-anchor="middle" font-size="28" fill="#94A3B8" opacity="0.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">▸</text>

    <rect x="440" y="0" width="170" height="44" rx="14" fill="#F1F5F9" opacity="0.4"/>
    <text x="525" y="32" text-anchor="middle" font-size="28" font-weight="700" fill="#94A3B8" opacity="0.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Stability</text>
  </g>

</svg>
