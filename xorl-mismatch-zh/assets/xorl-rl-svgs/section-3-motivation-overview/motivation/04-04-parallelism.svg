<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- Column dividers -->
  <line x1="427" y1="40" x2="427" y2="560" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="853" y1="40" x2="853" y2="560" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============ COLUMN 1: KERNELS (dim) ============ -->
  <g opacity="0.15">
  <text x="213" y="80" text-anchor="middle" font-size="48" font-weight="700" fill="#2563EB"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Kernels</text>

  <!-- Code block: for e in experts: -->
  <rect x="58" y="120" width="310" height="48" rx="10" fill="#1E1E2E" stroke="#3a3a4a" stroke-width="1.5"/>
  <text x="213" y="154" text-anchor="middle" font-size="26" font-weight="600" fill="#8be9fd"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">for e in experts:</text>

  <!-- E1 -->
  <rect x="128" y="200" width="170" height="70" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="213" y="247" text-anchor="middle" font-size="32" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₁</text>

  <!-- Arrow down -->
  <line x1="213" y1="270" x2="213" y2="310" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- E2 -->
  <rect x="128" y="320" width="170" height="70" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="213" y="367" text-anchor="middle" font-size="32" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₂</text>

  <!-- Arrow down -->
  <line x1="213" y1="390" x2="213" y2="430" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- E3 -->
  <rect x="128" y="440" width="170" height="70" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="213" y="487" text-anchor="middle" font-size="32" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₃</text>
  </g>

  <!-- ============ COLUMN 2: PARALLELISM (active) ============ -->

  <text x="640" y="80" text-anchor="middle" font-size="48" font-weight="700" fill="#0D9488"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Parallelism</text>

  <!-- Memory category bars (stacked vertically) -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="470" y="120" width="340" height="56" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <text x="640" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Weights</text>

    <rect x="470" y="192" width="340" height="56" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <text x="640" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Optimizer State</text>

