<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-tok1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#0369A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-tok2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-tok3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- ============ DENSE SECTION (pixel-identical to 0-0) ============ -->

  <text x="230" y="90" text-anchor="middle" font-size="56" font-weight="700" fill="#64748B"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Dense</text>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="60" y="176" width="90" height="48" rx="10" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <text x="105" y="210" text-anchor="middle" font-size="26" font-weight="600" fill="#475569" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">My</text>
    <rect x="60" y="266" width="100" height="48" rx="10" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <text x="110" y="300" text-anchor="middle" font-size="26" font-weight="600" fill="#475569" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">name</text>
    <rect x="60" y="356" width="90" height="48" rx="10" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <text x="105" y="390" text-anchor="middle" font-size="26" font-weight="600" fill="#475569" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">is</text>
  </g>

  <g stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-grey)">
    <line x1="150" y1="200" x2="205" y2="200"/>
    <line x1="160" y1="290" x2="205" y2="290"/>
    <line x1="150" y1="380" x2="205" y2="380"/>
  </g>

  <rect x="215" y="165" width="130" height="260" rx="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5"/>
  <text x="280" y="300" text-anchor="middle" font-size="42" font-weight="700" fill="#475569"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">FFN</text>
  <text x="280" y="325" text-anchor="middle" font-size="24" fill="#94A3B8"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">all params</text>

  <g stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-grey)">
    <line x1="345" y1="200" x2="390" y2="200"/>
    <line x1="345" y1="290" x2="390" y2="290"/>
    <line x1="345" y1="380" x2="390" y2="380"/>
  </g>

  <g>
    <rect x="400" y="184" width="36" height="32" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="400" y="274" width="36" height="32" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="400" y="364" width="36" height="32" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="60" y="460" width="180" height="56" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="150" y="483" text-anchor="middle" font-size="24" font-weight="700" fill="#475569" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Llama 3</text>
    <text x="150" y="507" text-anchor="middle" font-size="22" fill="#94A3B8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">8B</text>
    <rect x="260" y="460" width="180" height="56" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="350" y="483" text-anchor="middle" font-size="24" font-weight="700" fill="#475569" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Qwen3</text>
    <text x="350" y="507" text-anchor="middle" font-size="22" fill="#94A3B8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">32B</text>
  </g>

  <!-- ============ MoE SECTION ============ -->
  <!-- tokens (left) → Router (center) → experts vertical (right) -->

  <text x="880" y="90" text-anchor="middle" font-size="56" font-weight="700" fill="#0D9488"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Mixture of Experts</text>

  <!-- 3 tokens, color-coded -->
  <!-- y centers: 200, 290, 380 -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="550" y="176" width="100" height="48" rx="10" fill="#DBEAFE" stroke="#0369A1" stroke-width="2"/>
    <text x="600" y="210" text-anchor="middle" font-size="26" font-weight="600" fill="#0369A1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">My</text>

    <rect x="550" y="266" width="100" height="48" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <text x="600" y="300" text-anchor="middle" font-size="26" font-weight="600" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">name</text>

    <rect x="550" y="356" width="100" height="48" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="600" y="390" text-anchor="middle" font-size="26" font-weight="600" fill="#5B21B6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">is</text>
  </g>

  <!-- Arrows: tokens → Router -->
  <line x1="650" y1="200" x2="730" y2="275" stroke="#0369A1" stroke-width="2.5" marker-end="url(#arr-tok1)"/>
  <line x1="650" y1="290" x2="730" y2="290" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arr-tok2)"/>
  <line x1="650" y1="380" x2="730" y2="305" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-tok3)"/>

  <!-- Router box -->
  <rect x="740" y="258" width="130" height="64" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="805" y="294" text-anchor="middle" font-size="28" font-weight="700" fill="#1E40AF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Router</text>
  <text x="805" y="310" text-anchor="middle" font-size="22" fill="#3B82F6"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">top-1</text>

  <!-- 4 Experts stacked vertically -->
  <!-- y centers: 175, 255, 335, 415.  x: 1020 -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- E1: active (gets "My") -->
    <rect x="1020" y="148" width="120" height="54" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
    <text x="1080" y="186" text-anchor="middle" font-size="30" font-weight="700" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₁</text>

    <!-- E2: idle -->
    <rect x="1020" y="228" width="120" height="54" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1080" y="266" text-anchor="middle" font-size="30" fill="#CBD5E1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₂</text>

    <!-- E3: active (gets "name" and "is") -->
    <rect x="1020" y="308" width="120" height="54" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
    <text x="1080" y="346" text-anchor="middle" font-size="30" font-weight="700" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₃</text>

    <!-- E4: idle -->
    <rect x="1020" y="388" width="120" height="54" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1080" y="426" text-anchor="middle" font-size="30" fill="#CBD5E1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">E₄</text>
  </g>

  <!-- Routing arrows: Router → experts (color-coded by token) -->
  <!-- "My" (blue) → E1 -->
  <line x1="870" y1="278" x2="1020" y2="175" stroke="#0369A1" stroke-width="2.5" marker-end="url(#arr-tok1)"/>
  <!-- "name" (teal) → E3 -->
  <line x1="870" y1="290" x2="1020" y2="330" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arr-tok2)"/>
  <!-- "is" (purple) → E3 -->
  <line x1="870" y1="302" x2="1020" y2="340" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-tok3)"/>

  <!-- MoE Model cards -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="620" y="460" width="260" height="80" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
    <text x="750" y="494" text-anchor="middle" font-size="26" font-weight="700" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Kimi-2.5</text>
    <text x="750" y="522" text-anchor="middle" font-size="22" fill="#0D9488" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">1T Total, 32B Active</text>

    <rect x="900" y="460" width="260" height="80" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1030" y="494" text-anchor="middle" font-size="26" font-weight="700" fill="#115E59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">DeepSeek-V3</text>
    <text x="1030" y="522" text-anchor="middle" font-size="22" fill="#0D9488" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">671B Total, 37B Active</text>
  </g>

</svg>
