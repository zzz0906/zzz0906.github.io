<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1780" viewBox="0 0 1440 1780" role="img" aria-labelledby="title description">
<title id="title">我的私人 agent 系统：ChatGPT + Mac mini</title>
<desc id="description">手机和 MacBook 连接同一个私人 agent 系统。接近方形的银色 Mac mini 机身内包含 ChatGPT / Codex、常用 App 和 Loom。GPT 的主 agent 直接和我沟通，并调度子 agent。Mac mini 中的 Loom 管理 Claude Code、Cursor、Codex 和独立任务。Mac mini 连接 GCP 常驻服务、GPU 集群部署 GPU 任务，并与 OneDrive 同步资料。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52756d"/></marker>
<linearGradient id="aluminium-top" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#fafbfc"/><stop offset="0.52" stop-color="#e8ecef"/><stop offset="1" stop-color="#cdd3d9"/></linearGradient>
<linearGradient id="aluminium-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d1d7dd"/><stop offset="0.45" stop-color="#b8c0c9"/><stop offset="1" stop-color="#9ca7b2"/></linearGradient>
<filter id="device-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#344b46" flood-opacity="0.17"/></filter>
</defs>
