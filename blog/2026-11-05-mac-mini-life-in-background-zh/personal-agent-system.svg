<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1210" viewBox="0 0 1440 1210" role="img" aria-labelledby="title description">
<title id="title">我的私人 agent 系统</title>
<desc id="description">手机和 MacBook 连接 ChatGPT、Codex 中的私人幕僚长和主 agent。主 agent 通过 CUA 操作 Mac mini 上的日常软件，通过 Loom 和 MCP 调度研发任务。GCP 提供常驻服务，OneDrive 同步重要资料，GitHub Pages 承载个人网站，外置硬盘提供备份。</desc>
